name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compose file must reference variables, never literal credentials.
      - name: Check docker-compose for hardcoded secrets
        run: |
          if grep -nE '^[[:space:]]*(JWT_SECRET|ADMIN_PASSWORD):[[:space:]]*[^[:space:]$]' docker-compose.yml; then
            echo "::error::docker-compose.yml contains a literal secret. Use \${VAR} and keep the value in .env."
            exit 1
          fi
          echo "No literal secrets in docker-compose.yml"
