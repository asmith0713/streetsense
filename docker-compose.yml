version: '3.8'

services:
  # Backend Server
  backend:
    image: asmithreddy/streetsense-server:latest
    container_name: streetsense-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Use MongoDB Atlas - replace with your connection string
      MONGO_URI: mongodb+srv://maramreddy0713_db_user:dgVIor8Yjfsonxu4@cluster0.jumzcvr.mongodb.net/streetsense
      JWT_SECRET: niteeshlovessumaiyabutshedoesnt
      ADMIN_PASSWORD: 12qwaszx@A
      CORS_ORIGIN: http://localhost:3000,http://localhost:80,http://localhost
      GOOGLE_CLIENT_ID: 236637181211-66567rahq1a8samle5q40q6po87j6up6.apps.googleusercontent.com
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - streetsense-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Client
  frontend:
    image: asmithreddy/streetsense-client:latest
    container_name: streetsense-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:5000
      REACT_APP_GOOGLE_CLIENT_ID: 236637181211-66567rahq1a8samle5q40q6po87j6up6.apps.googleusercontent.com
    depends_on:
      - backend
    networks:
      - streetsense-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  streetsense-network:
    driver: bridge
