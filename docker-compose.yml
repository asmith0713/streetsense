version: '3.9'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: asmithreddy/streetsense-server:latest
    container_name: streetsense-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: niteeshlovessumaiya
      ADMIN_PASSWORD: 12qwaszx@A
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      PUBLIC_HOST: ${PUBLIC_HOST}
      CORS_ORIGIN: '${CORS_ORIGIN:-https://${PUBLIC_HOST},https://www.${PUBLIC_HOST},http://${PUBLIC_HOST},http://www.${PUBLIC_HOST},http://localhost:3000,https://localhost:3000}'
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://${PUBLIC_HOST}}
    networks:
      - streetsense-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://${PUBLIC_HOST}}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    image: asmithreddy/streetsense-client:latest
    container_name: streetsense-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    env_file:
      - .env
    networks:
      - streetsense-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  caddy:
    image: caddy:latest
    container_name: streetsense-proxy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    environment:
      TZ: UTC
      PUBLIC_HOST: ${PUBLIC_HOST}
    networks:
      - streetsense-network

networks:
  streetsense-network:
    driver: bridge
volumes:
   caddy_data:
   caddy_config: